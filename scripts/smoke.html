<!doctype html>
<!-- Temporary smoke-test harness. Loads the real app in an iframe, drives the
     same __probe handle the dev console uses, and writes what happened into the
     DOM so `chrome --headless --dump-dom` can report it without a WebSocket.

     main.js cannot be imported by a unit test (DOM, three and WebGL at module
     scope) and `vite build` only checks syntax, so a mis-scoped variable would
     otherwise ship green and throw on the first animation frame. -->
<html>
<head><meta charset="utf-8"><title>smoke</title></head>
<body>
<pre id="out">pending</pre>
<iframe id="app" src="/?smoke=1" style="width:1280px;height:720px;border:0"></iframe>
<script type="module">
const out = document.getElementById('out');
const result = { errors: [], checks: {} };
window.addEventListener('error', (e) => result.errors.push(String(e.message)));
window.addEventListener('unhandledrejection', (e) => result.errors.push(String(e.reason)));

const frame = document.getElementById('app');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

frame.addEventListener('load', async () => {
  const win = frame.contentWindow;
  win.addEventListener('error', (e) => result.errors.push('iframe: ' + e.message));
  win.addEventListener('unhandledrejection', (e) => result.errors.push('iframe: ' + e.reason));
  await wait(4000);

  try {
    const probe = win.__probe;
    result.checks.hasProbe = typeof probe !== 'undefined';
    if (!probe) throw new Error('window.__probe never appeared — main.js did not finish');

    result.checks.hasMenu = !!win.document.getElementById('menu');
    result.checks.hasCanvas = !!win.document.querySelector('canvas');
    result.checks.sceneChildren = probe.scene.children.length;
    result.checks.ballPool = probe.balls.length;
    result.checks.machineMode = probe.machine.mode?.name ?? null;
    result.checks.paddleBoundsValid = probe.desktopPaddle.boundsValid;
    result.checks.paddleBoundsVisible = probe.desktopPaddle.boundsHelper.visible;
    result.checks.paddleBoundsContainBlade = probe.desktopPaddle.bounds.containsPoint(
      probe.desktopPaddle.bladeCenter
    );

    // requestAnimationFrame is unreliable in a headless tab, so step the
    // simulation by hand — this is exactly what the dev console does.
    const t0 = performance.now();
    for (let i = 0; i < 180; i++) probe.tick(1 / 60);
    result.checks.framesStepped = 180;
    result.checks.simMs = Math.round(performance.now() - t0);
    result.checks.servedAfterTicks = probe.machine.servedCount;
    result.checks.gameRevision = probe.game.revision;
    result.checks.paddleBoundsValid = probe.desktopPaddle.boundsValid;
    result.checks.paddleBoundsVisible = probe.desktopPaddle.boundsHelper.visible;
    result.checks.paddleBoundsContainBlade = probe.desktopPaddle.bounds.containsPoint(
      probe.desktopPaddle.bladeCenter
    );
    if (!result.checks.paddleBoundsValid || !result.checks.paddleBoundsVisible || !result.checks.paddleBoundsContainBlade) {
      throw new Error('desktop paddle bounds were not live and visible');
    }

    // The machine sits disabled behind the start menu (main.js sets that on
    // purpose), so switch it on and let it actually play. This is the path the
    // aim solver feeds, exercised through the real game loop rather than a
    // unit test.
    probe.machine.enabled = true;
    let everActive = 0;
    const bounces = [];
    const prev = new Map();
    for (let i = 0; i < 200; i++) {
      probe.tick(1 / 60);
      const live = probe.balls.filter((b) => b.active);
      if (live.length) everActive = Math.max(everActive, live.length);
      for (const b of live) {
        const y = b.mesh.position.y;
        const vy = b.velocity?.y ?? 0;
        const before = prev.get(b);
        // A bounce is the ball's downward motion turning upward. The first one
        // for a served ball is the table; where resting position is useless,
        // because a ball that misses rolls on to the floor.
        if (before && before.vy < 0 && vy > 0 && (bounces.filter((p) => p.ball === b).length === 0)) {
          bounces.push({
            ball: b,
            x: Number(b.mesh.position.x.toFixed(3)),
            z: Number(b.mesh.position.z.toFixed(3)),
            aimX: Number(probe.machine.aim.x.toFixed(3)),
            aimZ: Number(probe.machine.aim.z.toFixed(3)),
          });
        }
        prev.set(b, { y, vy });
      }
    }
    result.checks.servedInPlay = probe.machine.servedCount;
    result.checks.maxBallsInPlay = everActive;
    result.checks.bounces = bounces.map(({ ball, ...rest }) => rest).slice(0, 8);
    result.checks.aimMissCm = bounces.map(
      (b) => Math.round(Math.hypot(b.x - b.aimX, b.z - b.aimZ) * 100)
    );
    // Every served ball should first come down on the player's half of the
    // table, and near where the machine said it was aiming.
    result.checks.allBouncesOnTable = bounces.every((b) => b.z > 0 && Math.abs(b.x) < 0.80);
    result.checks.worstAimMissCm = bounces.length
      ? Math.max(...result.checks.aimMissCm)
      : null;
  } catch (error) {
    result.errors.push(String(error && error.message ? error.message : error));
  }

  out.textContent = 'SMOKE_RESULT ' + JSON.stringify(result);
  document.title = 'smoke-done';
});
</script>
</body>
</html>
